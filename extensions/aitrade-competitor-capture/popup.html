<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8faf8;
      color: #18221d;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #1f7a55;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #647169;
      line-height: 1.4;
    }
    .preview-box {
      background: #ffffff;
      border: 1px solid #dfe6e0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .preview-box strong {
      color: #18221d;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e2f5ea;
      color: #1f7a55;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-sizing: border-box;
      text-decoration: none;
    }
    .button.primary {
      background: #1f7a55;
      color: #ffffff;
    }
    .button.primary:hover {
      background: #185e42;
    }
    .button.secondary {
      background: #ffffff;
      color: #18221d;
      border: 1px solid #dfe6e0;
      margin-top: 8px;
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      display: block;
      background: #e2f5ea;
      color: #1f7a55;
      border: 1px solid rgba(31,122,85,0.3);
    }
    .status.error {
      display: block;
      background: #fde8e5;
      color: #a13d39;
      border: 1px solid rgba(161,61,57,0.3);
    }
  </style>
</head>
<body>
  <h3>🎯 AITrade 竞品一键采集</h3>
  <p>在亚马逊商品详情页直接采集，自动提取真实面包屑、售价、五点描述与买家差评。</p>

  <div id="preview" class="preview-box">
    <div style="color: #888;">正在检测当前亚马逊页面…</div>
  </div>

  <button id="captureBtn" class="button primary" disabled>
    🚀 送入 AITrade 竞品对比
  </button>
  <button id="copyBtn" class="button secondary" style="display: none;">
    📋 复制结构化文本
  </button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
